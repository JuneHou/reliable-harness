<svg xmlns="http://www.w3.org/2000/svg" style="background:#ffffff" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1d1f1b" viewBox="0 0 1180 300" role="img" aria-label="One run of the program drawn as eight steps in a row. A patch changes the step that finds relevant chunks. Everything before that step is kept as recorded. The changed step is rerun and its output is compared with the recorded output. If the output is the same the recorded result stands. If it differs, the code steps after it are rerun and the model is called only for a prompt not seen before.">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1f1b"/></marker>
</defs>
<text x="16" y="24" font-weight="600" font-size="12.5">(a) One run of the program, step by step, and what the validator does at each step</text>

<rect x="82" y="60" width="366" height="150" fill="#1d1f1b" opacity="0.045"/>
<text x="90" y="78" fill="#5e615a" font-size="11">before the changed step, keep what was recorded</text>
<rect x="478" y="60" width="112" height="150" fill="#b4451f" opacity="0.10"/>
<text x="485" y="78" font-size="11" fill="#b4451f">the changed step</text>
<rect x="618" y="60" width="478" height="150" fill="#7b5aa6" opacity="0.07"/>
<text x="626" y="78" fill="#5e615a" font-size="11">after the changed step, rerun the code, call the model only when needed</text>

<text x="40" y="124" text-anchor="middle">question</text>
<line x1="66" y1="124" x2="90" y2="124" stroke="#1d1f1b" stroke-width="1.3" marker-end="url(#ah)"/>

<g fill="none" stroke="#1d1f1b" stroke-width="1.3">
  <rect x="90" y="105" width="86" height="38"/>
  <rect x="222" y="105" width="86" height="38"/>
  <rect x="354" y="105" width="86" height="38"/>
  <rect x="628" y="105" width="86" height="38"/>
  <rect x="892" y="105" width="86" height="38"/>
  <rect x="1024" y="105" width="60" height="38"/>
</g>
<g text-anchor="middle">
  <text x="133" y="123">load the</text><text x="133" y="137">file</text>
  <text x="265" y="123">split into</text><text x="265" y="137">chunks</text>
  <text x="397" y="123">build the</text><text x="397" y="137">index</text>
  <text x="671" y="123">build the</text><text x="671" y="137">prompt</text>
  <text x="671" y="160" fill="#5e615a" font-size="11">code, rerun exactly</text>
  <text x="935" y="123">read the</text><text x="935" y="137">answer</text>
  <text x="935" y="160" fill="#5e615a" font-size="11">code, rerun exactly</text>
  <text x="1054" y="123">check the</text><text x="1054" y="137">answer</text>
</g>
<rect x="486" y="105" width="96" height="38" fill="none" stroke="#b4451f" stroke-width="2"/>
<text x="534" y="123" text-anchor="middle" fill="#b4451f" font-weight="600">find relevant</text>
<text x="534" y="137" text-anchor="middle" fill="#b4451f" font-weight="600">chunks</text>
<text x="534" y="160" text-anchor="middle" font-size="11" fill="#b4451f">the patch changes this step</text>
<rect x="760" y="105" width="86" height="38" fill="none" stroke="#7b5aa6" stroke-width="1.8" stroke-dasharray="5 3"/>
<text x="803" y="123" text-anchor="middle">call the</text>
<text x="803" y="137" text-anchor="middle">model</text>
<text x="803" y="160" text-anchor="middle" fill="#5e615a" font-size="11">prompt seen before, reuse recorded answers</text>
<text x="803" y="174" text-anchor="middle" fill="#5e615a" font-size="11">new prompt, call the model</text>

<g stroke="#1d1f1b" stroke-width="1.3" marker-end="url(#ah)">
  <line x1="176" y1="124" x2="222" y2="124"/>
  <line x1="308" y1="124" x2="354" y2="124"/>
  <line x1="440" y1="124" x2="486" y2="124"/>
  <line x1="714" y1="124" x2="760" y2="124"/>
  <line x1="846" y1="124" x2="892" y2="124"/>
  <line x1="978" y1="124" x2="1024" y2="124"/>
</g>
<line x1="582" y1="124" x2="628" y2="124" stroke="#b4451f" stroke-width="1.6" marker-end="url(#ah)"/>
<g fill="#ffffff" stroke="#1d1f1b" stroke-width="1.3">
  <circle cx="199" cy="124" r="4"/><circle cx="331" cy="124" r="4"/><circle cx="463" cy="124" r="4"/>
  <circle cx="737" cy="124" r="4"/><circle cx="869" cy="124" r="4"/><circle cx="1001" cy="124" r="4"/>
</g>
<circle cx="605" cy="124" r="5" fill="#ffffff" stroke="#b4451f" stroke-width="2"/>
<g text-anchor="middle" font-size="11">
  <text x="199" y="100">state 1</text><text x="331" y="100">state 2</text><text x="463" y="100">state 3</text>
  <text x="605" y="100" fill="#b4451f">new state 4</text>
  <text x="737" y="100">state 5</text><text x="869" y="100">state 6</text><text x="1001" y="100">state 7</text>
</g>
<line x1="605" y1="130" x2="605" y2="172" stroke="#b4451f" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="605" y="188" text-anchor="middle" font-size="11" fill="#b4451f">compare with the recorded state 4</text>
<text x="605" y="203" text-anchor="middle" font-size="11" fill="#2d6a4f">same, stop here, the recorded result stands</text>
<text x="605" y="218" text-anchor="middle" fill="#5e615a" font-size="11">different, run the rest</text>

<circle cx="100" cy="248" r="4" fill="#ffffff" stroke="#1d1f1b" stroke-width="1.3"/>
<text x="112" y="252" fill="#5e615a" font-size="11">probe, records what passes between two steps</text>
<line x1="420" y1="248" x2="446" y2="248" stroke="#7b5aa6" stroke-width="1.8" stroke-dasharray="5 3"/>
<text x="454" y="252" fill="#5e615a" font-size="11">the model, a different answer each time</text>
<line x1="660" y1="248" x2="686" y2="248" stroke="#b4451f" stroke-width="2"/>
<text x="694" y="252" fill="#5e615a" font-size="11">the step the patch changes</text>
<text x="16" y="286" fill="#5e615a" font-size="11">The steps shown are those of the 78383658 program. The order of steps is read from the recorded runs.</text>
</svg>